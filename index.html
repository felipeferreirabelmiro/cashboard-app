  <style>

ng{font-size:14px}.form{padding:17px 15px}.type-pill{background:#fff;border:1px solid #e8e8ec;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:12px}.dot{width:10px;height:10px;background:#c557e4;border-radius:50%}.field{margin-bottom:13px}.field label{display:block;color:#8a8a94;font-size:10px;margin:0 0 5px 3px}.field input,.field select,.field textarea{width:100%;height:43px;border:1px solid #ececf0;border-radius:9px;background:#fff;padding:0 12px;font:13px inherit;color:#36363e;outline:none}.field textarea{height:70px;padding-top:11px;resize:vertical}.kind-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:white;border:1px solid #eaeaf0;border-radius:10px;padding:6px;margin-bottom:14px}.kind-switch button{border:0;border-radius:7px;background:#fff;color:#858590;padding:9px 2px;font-size:10px}.kind-switch button.active{background:#eaf8fc;color:#238fab;font-weight:700}.kind-switch button span{display:block;font-size:15px;margin-bottom:4px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{border:0;border-radius:9px;background:#6059ed;color:#fff;height:45px;width:100%;font-size:13px;font-weight:700;margin-top:4px}.delete{border:0;background:none;color:#c95c62;font-size:11px;padding:8px}.history-row{display:flex;align-items:center;gap:8px}.history-row .item{flex:1}.toast{position:fixed;bottom:77px;left:50%;transform:translate(-50%,12px);opacity:0;background:#292934;color:#fff;border-radius:8px;padding:10px 15px;font-size:12px;transition:.2s;z-index:5;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    body[data-theme="dark"]{background:#17181d;color:#e9e9ef}.dark-mode .phone{background:#202127;color:#e9e9ef}.dark-mode .status,.dark-mode .top,.dark-mode .subhead{background:#24252c;color:#ededf2;border-color:#373840}.dark-mode .brand,.dark-mode .month-name,.dark-mode .card-heading h2,.dark-mode .group-name,.dark-mode .item-name,.dark-mode .split-title{color:#ededf2}.dark-mode .month-card,.dark-mode .card,.dark-mode .type-pill,.dark-mode .kind-switch,.dark-mode .bottom,.dark-mode .field input,.dark-mode .field select,.dark-mode .field textarea{background:#2a2b33;border-color:#3a3b45;color:#e8e8ee}.dark-mode .bar,.dark-mode .group-color{background:#3a3b45}.dark-mode .group-value,.dark-mode .month-total,.dark-mode .item-value,.dark-mode .item-sub,.dark-mode .field label,.dark-mode .type-pill{color:#a9aab5}.dark-mode .item{border-color:#3a3b45}.dark-mode .item-icon{background:#383141}.dark-mode .item-icon.blue{background:#263a40}.dark-mode .item-icon.orange{background:#41362c}.dark-mode .kind-switch button{background:transparent;color:#b1b2bd}.dark-mode .kind-switch button.active{background:#343641;color:#8ed8e7}.dark-mode .tab{color:#999aa6}.dark-mode .tab.active{color:#aaa4ff}.dark-mode .top-button{color:#62bce5}.dark-mode .month-arrow,.dark-mode .more{color:#9697a2}
    .profile-hero{display:flex;align-items:center;gap:13px;margin:8px 0 17px;padding:18px 14px}.profile-avatar{width:52px;height:52px;flex:none;border-radius:50%;background:#eee9ff;color:#6458dc;display:grid;place-items:center;font-size:21px;font-weight:700}.profile-name{font-size:15px;font-weight:700}.profile-email{font-size:11px;color:#9999a2;margin-top:4px}.profile-section-title{font-size:11px;color:#85858e;margin:20px 3px 9px}.profile-save{margin-top:6px}.dark-mode .profile-avatar{background:#39344d;color:#b2a9ff}.dark-mode .profile-email,.dark-mode .profile-section-title{color:#a9aab5}
    .budget-card{padding:14px;margin-bottom:13px}.budget-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.budget-values{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:#777781}.budget-values strong{color:#34343c}.budget-progress{height:7px;background:#eeedf2;border-radius:8px;overflow:hidden;margin-top:10px}.budget-progress i{display:block;width:0;height:100%;background:#625bea;border-radius:inherit;transition:width .2s}.budget-message{margin-top:8px;font-size:10px;color:#85858e}.budget-card.warning .budget-progress i{background:#edaa3d}.budget-card.warning .budget-message{color:#a66d13}.budget-card.over .budget-progress i{background:#df5f63}.budget-card.over .budget-message,.budget-card.over .budget-values strong{color:#c4474d}.budget-link{border:0;background:none;padding:0;color:#6059ed;font-weight:700;font-size:11px}.dark-mode .budget-progress{background:#41414b}.dark-mode .budget-values{color:#b0b0ba}.dark-mode .budget-values strong{color:#ededf2}.dark-mode .budget-message{color:#aaaab5}.dark-mode .budget-link{color:#aaa4ff}
    @media(min-width:600px){.phone{margin:18px auto;min-height:calc(100vh - 36px);border-radius:24px;overflow:hidden}.bottom{position:absolute;bottom:0}}
  </style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>● ▮ ▰</span></div>
  <div class="top"><button class="top-button" aria-label="Voltar">‹</button><div class="brand">Cashboard</div><div><button class="top-button" id="themeToggle" aria-label="Ativar tema escuro" title="Alternar tema">◐</button><button class="top-button" id="headerAdd" aria-label="Adicionar lançamento">＋</button></div></div>
  <main>
    <section class="view active" id="homeView">
      <div class="page">
        <div class="month-card"><button class="month-arrow" id="prevMonth">‹</button><div class="month-center"><div class="month-name" id="monthLabel"></div><div class="bar"><span id="fixedBar"></span><span id="variableBar"></span><span id="investmentBar"></span></div><div class="month-total" id="monthTotal"></div></div><button class="month-arrow" id="nextMonth">›</button></div>
        <article class="card budget-card" id="budgetCard"></article>
        <article class="card"><div class="card-heading"><h2>Gastos do mês</h2><button class="more" aria-label="Mais opções">···</button></div>
          <div class="group-row"><span class="group-name">Despesas fixas</span><span class="group-value" id="fixedTotal"></span></div><div class="group-color"><i id="fixedLine"></i></div>
          <div class="group-row"><span class="group-name">Despesas variáveis</span><span class="group-value" id="variableTotal"></span></div><div class="group-color pink"><i id="variableLine"></i></div>
          <div class="group-row"><span class="group-name">Investimentos</span><span class="group-value" id="investmentTotal"></span></div><div class="group-color cyan"><i id="investmentLine"></i></div>
        </article>
        <div class="split-title"><span>Parcelamentos</span><button class="more" id="allInstallments">···</button></div>
        <article class="card list-card" id="installmentList"></article>
        <div class="split-title"><span>Lançamentos recentes</span><button class="more" id="allTransactions">Ver todos</button></div>
        <article class="card list-card" id="recentList"></article>
      </div>
      <button class="fab" id="fabAdd" aria-label="Adicionar lançamento">＋</button>
    </section>
    <section class="view" id="formView">
      <div class="subhead"><button id="cancelForm">Cancelar</button><strong id="formTitle">Adicionar transação</strong><button id="saveTop">Salvar</button></div>
      <form class="form" id="entryForm">
        <div class="type-pill"><i class="dot"></i><span id="typeLabel">Despesas variáveis</span></div>
        <div class="field"><label for="name">Nome</label><input id="name" required maxlength="60" placeholder="Ex.: Mercado"></div>
        <div class="kind-switch" id="kindSwitch"><button type="button" data-kind="variable" class="active"><span>⊖</span>Variável</button><button type="button" data-kind="fixed"><span>↻</span>Fixa</button><button type="button" data-kind="installment"><span>◷</span>Parcelada</button></div>
        <div class="kind-switch" id="flowSwitch" style="grid-template-columns:1fr 1fr"><button type="button" data-flow="expense" class="active"><span>⊖</span>Despesa</button><button type="button" data-flow="income"><span>＋</span>Receita</button></div>
        <div class="form-row"><div class="field"><label for="amount">Valor (R$)</label><input id="amount" required type="number" min="0.01" step="0.01" placeholder="0,00"></div><div class="field" id="installmentsField" hidden><label for="installments">Parcelas</label><input id="installments" type="number" min="2" max="120" value="2"></div></div>
        <div class="form-row"><div class="field"><label for="entryDate">Mês da compra</label><input id="entryDate" required type="date"></div><div class="field"><label for="dueDate">Vencimento</label><input id="dueDate" type="date"></div></div>
        <div class="field"><label for="notes">Comentários</label><textarea id="notes" maxlength="180" placeholder="Opcional"></textarea></div>
        <button class="save" type="submit">Salvar lançamento</button>
      </form>
    </section>
    <section class="view" id="historyView"><div class="subhead"><button id="backHome">‹ Início</button><strong>Todos os lançamentos</strong><button id="historyAdd">＋</button></div><div class="page"><div class="month-card"><button class="month-arrow" id="historyPrev">‹</button><div class="month-center"><div class="month-name" id="historyMonth"></div><div class="month-total" id="historyTotal"></div></div><button class="month-arrow" id="historyNext">›</button></div><article class="card list-card" id="historyList"></article></div></section>
  </main>
  <section class="view" id="profileView">
    <div class="subhead"><button id="profileBack">‹ Início</button><strong>Meu perfil</strong><span style="width:35px"></span></div>
    <div class="form">
      <div class="card profile-hero"><div class="profile-avatar" id="profileAvatar">?</div><div><div class="profile-name" id="profileDisplayName">Seu perfil</div><div class="profile-email" id="profileDisplayEmail">Adicione seus dados pessoais</div></div></div>
      <div class="profile-section-title">DADOS PESSOAIS</div>
      <form id="profileForm"><div class="field"><label for="profileNameInput">Nome</label><input id="profileNameInput" maxlength="60" placeholder="Como podemos te chamar?"></div><div class="field"><label for="profileEmailInput">E-mail</label><input id="profileEmailInput" type="email" maxlength="100" placeholder="voce@email.com"></div><div class="profile-section-title">SEU PLANEJAMENTO</div><div class="field"><label for="profileBudgetInput">Limite mensal de gastos (R$)</label><input id="profileBudgetInput" type="number" min="0" step="50" placeholder="Opcional"></div><button class="save profile-save" type="submit">Salvar meus dados</button></form>
    </div>
  </section>
  <nav class="bottom"><button class="tab active" id="tabHome"><span>⌂</span>Início</button><button class="tab" id="tabHistory"><span>☷</span>Lançamentos</button><button class="tab" id="tabProfile"><span>◉</span>Perfil</button></nav>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
  const KEY='contaclara.expenses.v1',THEME_KEY='cashboard.theme',PROFILE_KEY='cashboard.profile';let entries=readEntries(),month=new Date();month.setDate(1);let kind='variable',flow='expense';
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function readEntries(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(x=>({...x,kind:x.kind||(x.type==='installment'?'installment':'variable'),flow:x.flow||'expense',notes:x.notes||'',dueDate:x.dueDate||''}))}catch{return []}}function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
  function monthEntries(d){const key=monthKey(d);return entries.map(x=>{if(x.flow==='income')return null;if(x.kind==='installment'||x.type==='installment'){const start=parse(x.date),n=Number(x.installments)||1,diff=(d.getFullYear()-start.getFullYear())*12+d.getMonth()-start.getMonth();return diff>=0&&diff<n?{...x,part:diff+1,shown:Number(x.amount)/n}:null}return x.date?.slice(0,7)===key?{...x,part:null,shown:Number(x.amount)}:null}).filter(Boolean)}
  function renderRow(x,compact=false){const idx=entries.indexOf(entries.find(e=>e.id===x.id));let ico=x.kind==='installment'||x.type==='installment'?'◷':x.kind==='fixed'?'↻':x.kind==='investment'?'↗':'−',cls=x.kind==='installment'?'blue':x.kind==='fixed'?'orange':'';return `<div class="history-row"><div class="item"><span class="item-icon ${cls}">${ico}</span><div class="item-main"><div class="item-name">${safe(x.description)}</div><div class="item-sub">${(x.kind==='installment'||x.type==='installment')?`${x.part||1}/${x.installments} parcelas`:(x.kind==='fixed'?'Despesa fixa':x.kind==='investment'?'Investimento':'Despesa variável')}</div></div><div class="item-value">${money(x.shown??x.amount)}${(x.kind==='installment'||x.type==='installment')?`<small>${money(x.shown??Number(x.amount)/x.installments)} / mês</small>`:''}</div></div>${compact?'':`<button class="delete" data-remove="${safe(x.id)}" title="Excluir">Excluir</button>`}</div>`}
  function render(){const items=monthEntries(month),fixed=items.filter(x=>x.kind==='fixed').reduce((a,x)=>a+x.shown,0),variable=items.filter(x=>x.kind==='variable'||(!x.kind&&x.type==='cash')).reduce((a,x)=>a+x.shown,0),investment=items.filter(x=>x.kind==='investment').reduce((a,x)=>a+x.shown,0),total=fixed+variable+investment+items.filter(x=>x.kind==='installment'||x.type==='installment').reduce((a,x)=>a+x.shown,0);$('#monthLabel').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month);$('#monthTotal').textContent=`${money(total)} previstos`;$('#fixedTotal').textContent=money(fixed);$('#variableTotal').textContent=money(variable);$('#investmentTotal').textContent=money(investment);let max=Math.max(total,1);[['fixed',fixed],['variable',variable],['investment',investment]].forEach(([k,v])=>{$(`#${k}Line`).style.width=`${Math.min(v/max*100,100)}%`; $(`#${k}Bar`).style.width=`${Math.min(v/max*100,100)}%`});const parts=items.filter(x=>x.kind==='installment'||x.type==='installment');$('#installmentList').innerHTML=parts.length?parts.slice(0,4).map(x=>renderRow(x,true)).join(''):'<div class="empty">Nenhum parcelamento neste mês.</div>';const recent=[...items].sort((a,b)=>b.date.localeCompare(a.date));$('#recentList').innerHTML=recent.length?recent.slice(0,4).map(x=>renderRow(x,true)).join(''):'<div class="empty">Seus lançamentos aparecerão aqui.</div>';renderHistory()}
  function renderHistory(){const all=monthEntries(month).sort((a,b)=>b.date.localeCompare(a.date));const total=all.reduce((a,x)=>a+x.shown,0);$('#historyMonth').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month);$('#historyTotal').textContent=`${money(total)} no mês`;$('#historyList').innerHTML=all.length?all.map(x=>renderRow(x)).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>';renderBudgetCard(total)}
  function renderBudgetCard(total){let profile={};try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch{}const limit=Number(profile.budget)||0,card=$('#budgetCard');if(limit<=0){card.className='card budget-card';card.innerHTML='<div class="budget-head"><span>Limite mensal</span><button class="budget-link" id="budgetGoProfile">Definir no Perfil →</button></div><div class="budget-message">Cadastre um limite no Perfil para acompanhar quanto ainda pode gastar.</div>';$('#budgetGoProfile').onclick=()=>show('profile');return}const ratio=total/limit,pct=Math.round(ratio*100),remaining=limit-total,over=remaining<0,warning=!over&&ratio>=.8;card.className=`card budget-card${over?' over':warning?' warning':''}`;card.innerHTML=`<div class="budget-head"><span>Limite mensal</span><span>${pct}% usado</span></div><div class="budget-values"><span>Gasto: <strong>${money(total)}</strong></span><span>${over?'Excedido:':'Restam:'} <strong>${money(Math.abs(remaining))}</strong></span></div><div class="budget-progress" role="progressbar" aria-label="Uso do limite mensal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(pct,100)}"><i style="width:${Math.min(ratio*100,100)}%"></i></div><div class="budget-message">${over?`Você ultrapassou o limite em ${money(Math.abs(remaining))}.`:warning?`Atenção: você já usou ${pct}% do limite mensal.`:`Limite definido: ${money(limit)}.`}</div>`}
  function show(which){$$('.view').forEach(x=>x.classList.remove('active'));$(`#${which}View`).classList.add('active');$('#tabHome').classList.toggle('active',which==='home');$('#tabHistory').classList.toggle('active',which==='history');$('#tabProfile').classList.toggle('active',which==='profile');if(which==='profile')renderProfile();window.scrollTo(0,0)}function openForm(){kind='variable';flow='expense';$('#entryForm').reset();$('#entryDate').value=iso(new Date());$('#installmentsField').hidden=true;setChoice();show('form')}
  function setChoice(){$$('#kindSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));$$('#flowSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.flow===flow));$('#typeLabel').textContent=flow==='income'?'Receitas':kind==='fixed'?'Despesas fixas':kind==='installment'?'Parcelamentos':kind==='investment'?'Investimentos':'Despesas variáveis';$('#installmentsField').hidden=kind!=='installment'}
  function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
  $('#prevMonth').onclick=()=>moveMonth(-1);$('#nextMonth').onclick=()=>moveMonth(1);$('#historyPrev').onclick=()=>moveMonth(-1);$('#historyNext').onclick=()=>moveMonth(1);$('#headerAdd').onclick=$('#fabAdd').onclick=$('#historyAdd').onclick=openForm;$('#cancelForm').onclick=()=>show('home');$('#backHome').onclick=()=>show('home');$('#profileBack').onclick=()=>show('home');$('#saveTop').onclick=()=>$('#entryForm').requestSubmit();$('#tabHome').onclick=()=>show('home');$('#tabHistory').onclick=()=>show('history');$('#tabProfile').onclick=()=>show('profile');$('#allTransactions').onclick=()=>show('history');$('#allInstallments').onclick=()=>{$('#historyList').innerHTML=entries.filter(x=>x.kind==='installment'||x.type==='installment').map(x=>renderRow({...x,shown:x.amount/(x.installments||1),part:1})).join('')||'<div class="empty">Nenhum parcelamento cadastrado.</div>';show('history')};
  $$('#kindSwitch button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;setChoice()});$$('#flowSwitch button').forEach(b=>b.onclick=()=>{flow=b.dataset.flow;setChoice()});$('#entryForm').onsubmit=e=>{e.preventDefault();const x={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),description:$('#name').value.trim(),amount:Number($('#amount').value),date:$('#entryDate').value,dueDate:$('#dueDate').value,notes:$('#notes').value.trim(),kind,flow,installments:kind==='installment'?Number($('#installments').value):1,type:kind==='installment'?'installment':'cash'};entries.push(x);persist();show('home');render();const t=$('#toast');t.textContent='Lançamento salvo';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};
  function applyTheme(theme){document.body.dataset.theme=theme;document.body.classList.toggle('dark-mode',theme==='dark');$('#themeToggle').textContent=theme==='dark'?'☀':'◐';$('#themeToggle').setAttribute('aria-label',theme==='dark'?'Ativar tema claro':'Ativar tema escuro');localStorage.setItem(THEME_KEY,theme)}
  function renderProfile(){let p={};try{p=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch{}$('#profileNameInput').value=p.name||'';$('#profileEmailInput').value=p.email||'';$('#profileBudgetInput').value=p.budget||'';$('#profileDisplayName').textContent=p.name||'Seu perfil';$('#profileDisplayEmail').textContent=p.email||'Adicione seus dados pessoais';$('#profileAvatar').textContent=p.name?p.name.trim().charAt(0).toLocaleUpperCase('pt-BR'):'?'}
  $('#profileForm').onsubmit=e=>{e.preventDefault();const profile={name:$('#profileNameInput').value.trim(),email:$('#profileEmailInput').value.trim(),budget:$('#profileBudgetInput').value};localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));renderProfile();render();const t=$('#toast');t.textContent='Perfil salvo neste dispositivo';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};
  $('#themeToggle').onclick=()=>applyTheme(document.body.dataset.theme==='dark'?'light':'dark');applyTheme(localStorage.getItem(THEME_KEY)||'light');
  document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;entries=entries.filter(x=>x.id!==b.dataset.remove);persist();render()});render();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script>
